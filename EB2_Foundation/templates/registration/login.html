{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <h1 class="h3 mb-3">Log in</h1>
      <form method="post" novalidate>
        {% csrf_token %}
        {% include "_form_fields.html" %}
        <button type="submit" class="btn btn-primary">Log in</button>
      </form>
      <p class="mt-3"><a href="{% url 'accounts:password_reset' %}">Forgot your password?</a></p>
      <p>No account yet? <a href="{% url 'accounts:register' %}">Create one</a>.</p>
    </div>
  </div>
{% endblock %}
