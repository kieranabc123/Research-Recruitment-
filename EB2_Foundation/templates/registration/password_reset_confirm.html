{% extends "base.html" %}
{% block title %}Choose a new password{% endblock %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <h1 class="h3 mb-3">Choose a new password</h1>
      {% if validlink %}
        <form method="post" novalidate>
          {% csrf_token %}
          {% include "_form_fields.html" %}
          <button type="submit" class="btn btn-primary">Save new password</button>
        </form>
      {% else %}
        <p>This link has expired or has already been used.</p>
        <a class="btn btn-primary" href="{% url 'accounts:password_reset' %}">Ask for a new link</a>
      {% endif %}
    </div>
  </div>
{% endblock %}
