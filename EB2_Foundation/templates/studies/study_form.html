{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
  <a href="{% url 'pages:researcher_studies' %}" class="btn btn-link ps-0 mb-3">&larr; Back to my studies</a>

  <div class="row">
    <div class="col-12 col-lg-8">
      <h1 class="h3 mb-3">{{ title }}</h1>
      <form method="post" novalidate>
        {% csrf_token %}
        {% include "_form_fields.html" %}
        <button type="submit" class="btn btn-primary">Save study</button>
        <a href="{% url 'pages:researcher_studies' %}" class="btn btn-outline-secondary">Cancel</a>
      </form>
    </div>
  </div>
{% endblock %}
